name: Publish

# Publishes the package to npm when a version tag (vX.Y.Z) is pushed, then
# cuts a matching GitHub Release with auto-generated notes.
#
#   Release flow (Speakeasy owns the version number):
#     1. Merge a Speakeasy regen PR (it bumps "version" in package.json)
#     2. git tag vX.Y.Z <merge commit> && git push origin vX.Y.Z
#
# Auth: npm trusted publishing via OIDC — no NPM_TOKEN. Requires `id-token:
# write` below, npm CLI >= 11.5.1, and a Trusted Publisher configured on
# npmjs.com for this repo with the workflow filename set to "publish.yaml".
# Provenance is generated automatically (the repo is public).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (tag/branch/sha) to publish from
        type: string
        required: true

permissions:
  contents: write # create GitHub Releases / read tags
  id-token: write # OIDC token for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # Matches npm's official trusted-publishing example: setup-node@v6 +
      # Node 24 (ships npm >= 11.5.1, which OIDC trusted publishing requires)
      # with registry-url set. Older npm (Node 22 ships npm 10) does NOT do the
      # OIDC registry-auth handshake, so the publish falls back to a token and
      # fails (404 / ENEEDAUTH). No NODE_AUTH_TOKEN — auth is OIDC.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json=$PKG_VERSION  tag=$TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Skip if version already on npm
        id: check
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "$PKG_NAME@$PKG_VERSION is already published — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.check.outputs.skip == 'false'
        run: npm run build

      - name: Publish to npm
        if: steps.check.outputs.skip == 'false'
        run: |
          echo "Publishing with npm $(npm --version) on node $(node --version)"
          npm publish --access public

      - name: Create GitHub Release
        if: github.event_name == 'push' && steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — skipping."
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
